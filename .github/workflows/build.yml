name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf automake libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev \
          libssl-dev cmake openjdk-17-jdk gettext libltdl-dev \
          build-essential libstdc++6 zlib1g:i386 libbz2-1.0:i386

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install cython==0.29.36 buildozer==1.5.0

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
