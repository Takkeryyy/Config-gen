name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip zip python3-pip \
          pkg-config libncursesw5-dev libssl-dev libsqlite3-dev tk-dev \
          libc6-dev libbz2-dev libffi-dev zlib1g-dev default-jre default-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          # Строго фиксируем Cython 3.0.10 для Kivy 2.3.0 и Buildozer 1.5.0
          pip install buildozer==1.5.0 Cython==3.0.10 virtualenv

      - name: Build with Buildozer
        run: yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameConfigGen-APK
          path: bin/*.apk
